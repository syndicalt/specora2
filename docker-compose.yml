services:
  neo4j:
    image: neo4j:5.18-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/specora123
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: specora
      POSTGRES_PASSWORD: specora123
      POSTGRES_DB: specora
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./packages/db/migrations/002_discovery.sql:/docker-entrypoint-initdb.d/002_discovery.sql
      - ./packages/db/migrations/003_chat.sql:/docker-entrypoint-initdb.d/003_chat.sql
      - ./packages/db/migrations/004_users.sql:/docker-entrypoint-initdb.d/004_users.sql
      - ./packages/db/migrations/005_seed_users.sql:/docker-entrypoint-initdb.d/005_seed_users.sql
      - ./packages/db/migrations/006_marketplace.sql:/docker-entrypoint-initdb.d/006_marketplace.sql
      - ./packages/db/migrations/007_marketplace_seed.sql:/docker-entrypoint-initdb.d/007_marketplace_seed.sql
      - ./packages/db/migrations/008_saved_views.sql:/docker-entrypoint-initdb.d/008_saved_views.sql
      - ./packages/db/migrations/009_change_manager.sql:/docker-entrypoint-initdb.d/009_change_manager.sql
      - ./packages/db/migrations/010_event_bus.sql:/docker-entrypoint-initdb.d/010_event_bus.sql
      - ./packages/db/migrations/011_audit_log.sql:/docker-entrypoint-initdb.d/011_audit_log.sql
      - ./packages/db/migrations/012_app_permissions.sql:/docker-entrypoint-initdb.d/012_app_permissions.sql
      - ./packages/db/migrations/013_chat_trace.sql:/docker-entrypoint-initdb.d/013_chat_trace.sql
      - ./packages/db/migrations/013_job_queue.sql:/docker-entrypoint-initdb.d/013_job_queue.sql
      - ./packages/db/migrations/014_upgrade_jobs.sql:/docker-entrypoint-initdb.d/014_upgrade_jobs.sql
      - ./packages/db/migrations/015_system_properties.sql:/docker-entrypoint-initdb.d/015_system_properties.sql
      - ./packages/db/migrations/016_change_request_cis.sql:/docker-entrypoint-initdb.d/016_change_request_cis.sql
      - ./packages/db/migrations/017_change_request_approvers.sql:/docker-entrypoint-initdb.d/017_change_request_approvers.sql
      - ./packages/db/migrations/018_role_expansion.sql:/docker-entrypoint-initdb.d/018_role_expansion.sql
      - ./packages/db/migrations/019_change_request_comments.sql:/docker-entrypoint-initdb.d/019_change_request_comments.sql
      - ./packages/db/migrations/020_marketplace_admin_panels.sql:/docker-entrypoint-initdb.d/020_marketplace_admin_panels.sql
      - ./packages/db/migrations/021_change_request_planned_times.sql:/docker-entrypoint-initdb.d/021_change_request_planned_times.sql
      - ./packages/db/migrations/022_change_request_impact.sql:/docker-entrypoint-initdb.d/022_change_request_impact.sql
      - ./packages/db/migrations/023_risk_score_history.sql:/docker-entrypoint-initdb.d/023_risk_score_history.sql
      - ./packages/db/migrations/024_ci_classes.sql:/docker-entrypoint-initdb.d/024_ci_classes.sql
      - ./packages/db/migrations/025_cmdb_admin_permission.sql:/docker-entrypoint-initdb.d/025_cmdb_admin_permission.sql
      - ./packages/db/migrations/026_tables_data_foundations_permissions.sql:/docker-entrypoint-initdb.d/026_tables_data_foundations_permissions.sql
      - ./packages/db/migrations/027_discovery_pipelines.sql:/docker-entrypoint-initdb.d/027_discovery_pipelines.sql
      - ./packages/db/migrations/028_incident_manager.sql:/docker-entrypoint-initdb.d/028_incident_manager.sql
      - ./packages/db/migrations/029_knowledge_core.sql:/docker-entrypoint-initdb.d/029_knowledge_core.sql
      - ./packages/db/migrations/030_prevention_center.sql:/docker-entrypoint-initdb.d/030_prevention_center.sql
      - ./packages/db/migrations/031_asset_command_center.sql:/docker-entrypoint-initdb.d/031_asset_command_center.sql
      - ./packages/db/migrations/032_demo_itsm_itam_seed.sql:/docker-entrypoint-initdb.d/032_demo_itsm_itam_seed.sql
      - ./packages/db/migrations/033_discovery_staging.sql:/docker-entrypoint-initdb.d/033_discovery_staging.sql
      - ./packages/db/migrations/034_discovery_pipeline_schedules.sql:/docker-entrypoint-initdb.d/034_discovery_pipeline_schedules.sql
      - ./packages/db/migrations/035_number_sequences.sql:/docker-entrypoint-initdb.d/035_number_sequences.sql
      - ./packages/db/migrations/036_it_visibility_dcim.sql:/docker-entrypoint-initdb.d/036_it_visibility_dcim.sql
      - ./packages/db/migrations/037_dcim_floorplan_connections.sql:/docker-entrypoint-initdb.d/037_dcim_floorplan_connections.sql
      - ./packages/db/migrations/038_discovery_lifecycle.sql:/docker-entrypoint-initdb.d/038_discovery_lifecycle.sql
      - ./packages/db/migrations/039_app_provisioning.sql:/docker-entrypoint-initdb.d/039_app_provisioning.sql

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=specora123
      - DATABASE_URL=postgresql://specora:specora123@postgres:5432/specora
      - JWT_SECRET=dev-secret-change-me
      - WORKER_GRPC_HOST=worker:50051
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PROVARA_URL=${PROVARA_URL}
      - PROVARA_API_KEY=${PROVARA_API_KEY}
      - UPLOAD_DIR=./uploads
    depends_on:
      - neo4j
      - postgres
    volumes:
      - .:/app
      - /app/node_modules
    command: pnpm --filter @specora/api dev

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/graphql
      - NEXT_PUBLIC_WS_URL=ws://localhost:4000/graphql
    depends_on:
      - api
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/.next
    command: pnpm --filter @specora/web dev

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    working_dir: /app/apps/worker
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=specora123
      - DATABASE_URL=postgresql://specora:specora123@postgres:5432/specora
      - GRPC_PORT=50051
      - PATHLIGHT_URL=${PATHLIGHT_URL:-http://172.20.0.1:4100}
    depends_on:
      - neo4j
      - postgres
    volumes:
      - .:/app
      - /app/apps/worker/__pycache__
    command: python -m src.main

volumes:
  neo4j_data:
  postgres_data:

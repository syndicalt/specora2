version: "3.8"
services:
  neo4j:
    image: neo4j:5.18-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/specora123
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: specora
      POSTGRES_PASSWORD: specora123
      POSTGRES_DB: specora
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./packages/db/migrations/002_discovery.sql:/docker-entrypoint-initdb.d/002_discovery.sql
      - ./packages/db/migrations/003_chat.sql:/docker-entrypoint-initdb.d/003_chat.sql
      - ./packages/db/migrations/004_users.sql:/docker-entrypoint-initdb.d/004_users.sql
      - ./packages/db/migrations/005_seed_users.sql:/docker-entrypoint-initdb.d/005_seed_users.sql
      - ./packages/db/migrations/006_marketplace.sql:/docker-entrypoint-initdb.d/006_marketplace.sql
      - ./packages/db/migrations/007_marketplace_seed.sql:/docker-entrypoint-initdb.d/007_marketplace_seed.sql
      - ./packages/db/migrations/008_saved_views.sql:/docker-entrypoint-initdb.d/008_saved_views.sql

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=specora123
      - DATABASE_URL=postgresql://specora:specora123@postgres:5432/specora
      - JWT_SECRET=dev-secret-change-me
      - WORKER_GRPC_HOST=worker:50051
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PROVARA_URL=${PROVARA_URL}
      - PROVARA_API_KEY=${PROVARA_API_KEY}
      - UPLOAD_DIR=./uploads
    depends_on:
      - neo4j
      - postgres
    volumes:
      - .:/app
      - /app/node_modules
    command: pnpm --filter @specora/api dev

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/graphql
      - NEXT_PUBLIC_WS_URL=ws://localhost:4000/graphql
    depends_on:
      - api
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/.next
    command: pnpm --filter @specora/web dev

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    working_dir: /app/apps/worker
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=specora123
      - DATABASE_URL=postgresql://specora:specora123@postgres:5432/specora
      - GRPC_PORT=50051
      - PATHLIGHT_URL=${PATHLIGHT_URL:-http://172.20.0.1:4100}
    depends_on:
      - neo4j
      - postgres
    volumes:
      - .:/app
      - /app/apps/worker/__pycache__
    command: python -m src.main

volumes:
  neo4j_data:
  postgres_data:
